<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="100%" height="100%">
  <defs>
    <linearGradient id="vBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051630" />
      <stop offset="50%" stop-color="#092754" />
      <stop offset="100%" stop-color="#0F3875" />
    </linearGradient>
    <linearGradient id="vGold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD555" />
      <stop offset="100%" stop-color="#FF9800" />
    </linearGradient>
  </defs>

  <rect width="600" height="280" fill="url(#vBg)" />

  <!-- Subtle grid lines -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="50" x2="600" y2="50" />
    <line x1="0" y1="100" x2="600" y2="100" />
    <line x1="0" y1="150" x2="600" y2="150" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="100" y1="0" x2="100" y2="280" />
    <line x1="200" y1="0" x2="200" y2="280" />
    <line x1="300" y1="0" x2="300" y2="280" />
    <line x1="400" y1="0" x2="400" y2="280" />
    <line x1="500" y1="0" x2="500" y2="280" />
  </g>

  <!-- Ambient glow -->
  <circle cx="480" cy="120" r="130" fill="#FFC928" opacity="0.12" />

  <!-- Decorative stylized V icon in background -->
  <g transform="translate(460, 115) scale(1.6)" opacity="0.8">
    <path d="M-36,-38 L-14,-38 L-2,18 L-20,18 Z" fill="#FFFFFF" opacity="0.15" />
    <path d="M-2,18 L14,-38 L36,-38 L12,24 C8,34 -8,34 -12,24 Z" fill="url(#vGold2)" />
  </g>

  <!-- Content text -->
  <text x="50" y="80" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="2">
    VYAPARA
  </text>
  <text x="50" y="112" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#FFC928" letter-spacing="2">
    SMART BUSINESS &amp; BILLING PLATFORM
  </text>
  <text x="50" y="145" font-family="'Inter', sans-serif" font-weight="400" font-size="13" fill="#94A3B8">
    GST Invoicing • Ledger Accounting • Point of Sale &amp; Inventory
  </text>

  <!-- Category badge lower right -->
  <g transform="translate(400, 225)">
    <rect width="175" height="32" rx="16" fill="rgba(255, 201, 40, 0.15)" stroke="rgba(255, 201, 40, 0.45)" stroke-width="1.5" />
    <text x="87" y="20" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#FFC928" letter-spacing="1.5">BUSINESS SOFTWARE</text>
  </g>
</svg>

