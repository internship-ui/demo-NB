<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041426" />
      <stop offset="50%" stop-color="#072242" />
      <stop offset="100%" stop-color="#0B305C" />
    </linearGradient>
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C27B0" />
      <stop offset="35%" stop-color="#E91E63" />
      <stop offset="70%" stop-color="#FF9800" />
      <stop offset="100%" stop-color="#FFEB3B" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="280" fill="url(#bgGrad)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="40" x2="600" y2="40" />
    <line x1="0" y1="80" x2="600" y2="80" />
    <line x1="0" y1="120" x2="600" y2="120" />
    <line x1="0" y1="160" x2="600" y2="160" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="80" y1="0" x2="80" y2="280" />
    <line x1="160" y1="0" x2="160" y2="280" />
    <line x1="240" y1="0" x2="240" y2="280" />
    <line x1="320" y1="0" x2="320" y2="280" />
    <line x1="400" y1="0" x2="400" y2="280" />
    <line x1="480" y1="0" x2="480" y2="280" />
    <line x1="560" y1="0" x2="560" y2="280" />
  </g>

  <!-- Ambient glow circle -->
  <circle cx="480" cy="110" r="140" fill="#E91E63" opacity="0.12" filter="blur(40px)" />
  <circle cx="150" cy="180" r="120" fill="#00A859" opacity="0.1" filter="blur(40px)" />

  <!-- Brand Elements -->
  <g transform="translate(420, 120)">
    <polygon points="0,-60 55,35 -55,35" fill="url(#prismGrad)" opacity="0.85" />
    <polygon points="0,-60 55,35 15,15" fill="#E91E63" opacity="0.9" />
  </g>

  <!-- Title & Slogan -->
  <text x="50" y="80" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="1">
    JKD <tspan fill="#00D26A">MART</tspan>
  </text>
  <text x="50" y="112" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#FFC928" letter-spacing="2">
    SMART DIGITAL RETAIL &amp; SUPERMARKET
  </text>
  <text x="50" y="145" font-family="'Inter', sans-serif" font-weight="400" font-size="13" fill="#94A3B8">
    Daily Essentials • Groceries • Instant Delivery Workflow
  </text>

  <!-- Category badge lower right -->
  <g transform="translate(430, 225)">
    <rect width="145" height="32" rx="16" fill="rgba(0, 168, 89, 0.25)" stroke="rgba(0, 210, 106, 0.5)" stroke-width="1.5" />
    <text x="72" y="20" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#00D26A" letter-spacing="1.5">RETAIL &amp; MART</text>
  </g>
</svg>

