<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="100%" height="100%">
  <defs>
    <linearGradient id="tbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E30" />
      <stop offset="50%" stop-color="#1F2E4A" />
      <stop offset="100%" stop-color="#2D1F18" />
    </linearGradient>
  </defs>

  <rect width="600" height="280" fill="url(#tbBg)" />

  <!-- Ambient warm glow -->
  <circle cx="480" cy="110" r="140" fill="#DD6B20" opacity="0.16" />
  <circle cx="150" cy="160" r="110" fill="#FFC928" opacity="0.1" />

  <!-- Grid decoration -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="50" x2="600" y2="50" />
    <line x1="0" y1="100" x2="600" y2="100" />
    <line x1="0" y1="150" x2="600" y2="150" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="120" y1="0" x2="120" y2="280" />
    <line x1="240" y1="0" x2="240" y2="280" />
    <line x1="360" y1="0" x2="360" y2="280" />
    <line x1="480" y1="0" x2="480" y2="280" />
  </g>

  <!-- Illustration watermark in background -->
  <g transform="translate(470, 110) scale(1.4)" opacity="0.85">
    <circle cx="0" cy="0" r="32" fill="#FBD38D" />
    <path d="M-30,-9 C-30,-29 30,-29 30,-9 Z" fill="#DD6B20" />
    <ellipse cx="0" cy="-9" rx="34" ry="7" fill="#C05621" />
    <circle cx="0" cy="-29" r="6" fill="#FFD555" />
    <circle cx="-12" cy="-1" r="8" fill="none" stroke="#7B341E" stroke-width="2.5" />
    <circle cx="12" cy="-1" r="8" fill="none" stroke="#7B341E" stroke-width="2.5" />
    <line x1="-4" y1="-1" x2="4" y2="-1" stroke="#7B341E" stroke-width="2.5" />
    <path d="M-9,14 Q0,21 9,14" fill="none" stroke="#7B341E" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Content text -->
  <text x="50" y="80" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="1">
    Tokens <tspan fill="#FF9800">Boy</tspan>
  </text>
  <text x="50" y="112" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#FFD555" letter-spacing="2">
    SMART TOKEN &amp; QUEUE MANAGEMENT
  </text>
  <text x="50" y="145" font-family="'Inter', sans-serif" font-weight="400" font-size="13" fill="#94A3B8">
    Online Token Booking • Live Queue Tracking • SMS/WhatsApp Alerts
  </text>

  <!-- Category badge lower right -->
  <g transform="translate(390, 225)">
    <rect width="185" height="32" rx="16" fill="rgba(255, 152, 0, 0.2)" stroke="rgba(255, 179, 0, 0.5)" stroke-width="1.5" />
    <text x="92" y="20" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#FFB74D" letter-spacing="1.5">QUEUE APPLICATION</text>
  </g>
</svg>

