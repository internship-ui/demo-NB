<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" rx="36" fill="#FCEBD4"/>
  <g transform="translate(100, 68)">
    <!-- Boy Character Face & Cap -->
    <circle cx="0" cy="0" r="28" fill="#FBD38D" />
    <!-- Cap -->
    <path d="M-26,-8 C-26,-26 26,-26 26,-8 Z" fill="#DD6B20" />
    <ellipse cx="0" cy="-8" rx="30" ry="6" fill="#C05621" />
    <circle cx="0" cy="-26" r="5" fill="#FFD555" />
    
    <!-- Glasses -->
    <circle cx="-10" cy="-1" r="7" fill="none" stroke="#7B341E" stroke-width="2" />
    <circle cx="10" cy="-1" r="7" fill="none" stroke="#7B341E" stroke-width="2" />
    <line x1="-3" y1="-1" x2="3" y2="-1" stroke="#7B341E" stroke-width="2" />

    <!-- Smile -->
    <path d="M-8,12 Q0,18 8,12" fill="none" stroke="#7B341E" stroke-width="2" stroke-linecap="round" />

    <!-- Service Bell / Token in Hand -->
    <path d="M22,14 Q32,6 26,-4" fill="none" stroke="#DD6B20" stroke-width="4" stroke-linecap="round" />
    <circle cx="27" cy="-6" r="6" fill="#FFC928" stroke="#DD6B20" stroke-width="2" />
  </g>
  <!-- Typography -->
  <text x="100" y="148" text-anchor="middle" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="24" fill="#C05621" letter-spacing="1">Tokens</text>
  <text x="100" y="172" text-anchor="middle" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="22" fill="#DD6B20" letter-spacing="2">Boy</text>
</svg>

